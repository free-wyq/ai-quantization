<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>量化回测看板</title>
<script src="klinecharts.min.js"></script>
<script src="runs/index.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#0f1115; color:#e6e6e6; }
  header { padding:12px 16px; background:#171a21; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; color:#ffd666; }
  select { background:#22262f; color:#e6e6e6; border:1px solid #333; border-radius:6px;
           padding:6px 10px; font-size:14px; min-width:300px; }
  .wrap { padding:0; }
  .chart-wrap { width:100%; padding-left:24px; padding-right:8px; }
  #equity { width:100%; height:120px; background:#171a21; border-radius:8px 8px 0 0; display:block; }
  #chart { width:100%; height:560px; background:#171a21; border-radius:0 0 8px 8px; }
  .panel { display:flex; flex-wrap:wrap; gap:10px; margin:14px 16px; }
  .card { background:#171a21; border:1px solid #262b35; border-radius:8px; padding:10px 14px; min-width:130px; }
  .card .k { font-size:12px; color:#8b93a1; }
  .card .v { font-size:18px; font-weight:600; margin-top:2px; }
  .pos { color:#ff4d4f; } .neg { color:#00c853; }
  .hint { color:#8b93a1; font-size:12px; margin-left:auto; }
  .section-title { font-size:14px; color:#ffd666; margin:16px 16px 8px; }
  table { width:calc(100% - 32px); margin:0 16px; border-collapse:collapse; background:#171a21; border-radius:8px; overflow:hidden; }
  th, td { padding:8px 12px; text-align:right; font-size:13px; border-bottom:1px solid #262b35; }
  th { color:#8b93a1; font-weight:500; background:#1c2029; }
  td:first-child, th:first-child { text-align:center; }
  td.pnl-pos { color:#ff4d4f; } td.pnl-neg { color:#00c853; }
  .tag-buy { color:#ff4d4f; font-weight:600; } .tag-sell { color:#00c853; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>量化回测看板</h1>
  <select id="sel"></select>
  <span class="hint">klinecharts 离线版 · 下拉切换历史</span>
</header>
<div class="wrap">
  <div class="chart-wrap">
    <canvas id="equity"></canvas>
    <div id="chart"></div>
  </div>
  <div class="panel" id="metrics"></div>
  <div class="section-title">交易明细</div>
  <table id="trades">
    <thead><tr><th>类型</th><th>日期</th><th>价格</th><th>盈亏</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const RUNS = window.__RUNS__ || [];
const sel = document.getElementById('sel');
const chartEl = document.getElementById('chart');
const metricsEl = document.getElementById('metrics');
const tradesBody = document.querySelector('#trades tbody');

RUNS.forEach((r, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = r.label; sel.appendChild(o);
});

function fmt(n, d=2){ return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function cls(v){ return v>=0 ? 'pos' : 'neg'; }
function sign(v){ return v>=0 ? '+' : ''; }
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---- klinecharts v10 ---- */
const MAX_BARS = 150;
const SCROLL_OFFSET = 3;  // scrollToDataIndex 边界修正值

const chart = klinecharts.init('chart');
chart.setStyles({
  grid: { horizontal: { color: 'transparent' }, vertical: { color: 'transparent' } },
  crosshair: {
    horizontal: { text: { backgroundColor: '#1f77b4' } },
    vertical: { text: { backgroundColor: '#1f77b4' } }
  }
});

// 买卖点标注 (simpleAnnotation: 虚线+箭头+文字)
function addAnnotation(point, label, color) {
  try {
    chart.createOverlay({
      name: 'simpleAnnotation',
      lock: true,
      points: [{ timestamp: point.timestamp, value: point.price }],
      extendData: label,
      styles: { line: { color, style: 'dashed' }, text: { color, size: 13, weight: 'bold' } }
    });
  } catch(e) { console.warn('overlay:', e); }
}

// 权益曲线 (独立 canvas, 位于 K 线图上方)
const equityCv = document.getElementById('equity');
function drawEquity(equity) {
  const dpr = window.devicePixelRatio || 1;
  const w = equityCv.clientWidth, h = equityCv.clientHeight;
  equityCv.width = w * dpr; equityCv.height = h * dpr;
  const ctx = equityCv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!equity || !equity.length) return;
  const vals = equity.map(e => e.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const padX = 10, padY = 14;
  const x = i => padX + (w - padX * 2) * i / (vals.length - 1 || 1);
  const y = v => h - padY - (h - padY * 2) * (v - min) / range;
  // 填充区域
  ctx.beginPath();
  vals.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.lineTo(x(vals.length - 1), h);
  ctx.lineTo(x(0), h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(31,119,180,0.35)');
  grad.addColorStop(1, 'rgba(31,119,180,0)');
  ctx.fillStyle = grad;
  ctx.fill();
  // 曲线
  ctx.strokeStyle = '#1f77b4';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  vals.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.stroke();
  // 标签
  ctx.fillStyle = '#8b93a1';
  ctx.font = '12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('账户权益  ' + fmt(vals[vals.length - 1]), 10, 16);
}

// 策略曲线: 动态注册并绘制
let registeredStratInds = [];
function renderStrategyIndicators(r) {
  // 清除旧策略指标
  registeredStratInds.forEach(name => chart.removeIndicator({ name }));
  registeredStratInds = [];
  if (!r.indicators || !r.indicators.length) return;

  r.indicators.forEach(ind => {
    const figKey = 'val';
    const figType = ind.type || 'line';
    const figStyle = ind.lineStyle || 'solid';
    const figWidth = ind.lineWidth || 1;
    klinecharts.registerIndicator({
      name: ind.name,
      shortName: ind.shortName,
      series: ind.pane === 'main' ? 'price' : 'normal',
      precision: 4,
      figures: [{ key: figKey, title: ind.shortName + ': ', type: figType }],
      calc: dataList => dataList.map((d, i) => ({
        [figKey]: (i < ind.values.length && ind.values[i] != null) ? ind.values[i] : null
      }))
    });
    const paneId = ind.pane === 'main' ? 'candle_pane' : ('strat_' + (ind.paneId || ind.name));
    chart.createIndicator({
      name: ind.name, paneId,
      styles: { lines: [{ color: ind.color, style: figStyle, size: figWidth }] }
    });
    registeredStratInds.push(ind.name);
  });
}

function render(idx){
  const r = RUNS[idx];
  if (!r) return;

  chart.removeOverlay();
  chart.removeIndicator({ name: 'VOL' });

  // 权益曲线
  drawEquity(r.equity);

  // v10: setSymbol + setPeriod + setDataLoader 三者就绪后触发 getBars
  chart.setSymbol({ ticker: r.symbol });
  chart.setPeriod({ type: 'day', span: 1 });
  chart.setDataLoader({
    getBars: ({ callback }) => {
      callback(r.candles, false);
      // 设置柱宽并让首根K线显示在最左侧
      setTimeout(() => {
        const w = chartEl.clientWidth;
        const visibleBars = Math.min(r.candles.length, MAX_BARS);
        const barSpace = Math.max(4, Math.min(50, Math.floor(w / visibleBars)));
        chart.setBarSpace(barSpace);
        // scrollToDataIndex(n) 将第n根放到右侧边缘，滚动到 fitBars-offset 使首根在左侧
        const fitBars = Math.floor(w / barSpace);
        chart.scrollToDataIndex(Math.min(r.candles.length - 1, fitBars - SCROLL_OFFSET));
      }, 50);
    }
  });

  chart.createIndicator({ name: 'VOL', paneId: 'vol_pane' });

  // 策略曲线 (MA均线/唐奇安通道/MACD等, 由策略函数动态提供)
  renderStrategyIndicators(r);

  // 买卖点标注
  r.buys.forEach(p => addAnnotation(p, 'B', '#ff4d4f'));
  r.sells.forEach(p => addAnnotation(p, 'S', '#00c853'));

  // 指标卡片
  const m = r.metrics;
  const cards = [
    ['策略收益率', sign(m.total_return)+fmt(m.total_return)+'%', cls(m.total_return)],
    ['基准收益率', fmt(m.benchmark)+'%', cls(m.benchmark)],
    ['超额收益', sign(m.excess)+fmt(m.excess)+'%', cls(m.excess)],
    ['夏普比率', fmt(m.sharpe), ''],
    ['最大回撤', fmt(m.max_dd)+'%', 'neg'],
    ['交易次数', m.n_trades, ''],
    ['胜率', fmt(m.win_rate)+'%', ''],
    ['盈亏比', m.profit_factor===Infinity?'∞':fmt(m.profit_factor), ''],
  ];
  metricsEl.innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('');

  // 交易明细表
  const trades = [];
  r.buys.forEach((b, i) => {
    const s = r.sells[i];
    trades.push({type:'买入', date:b.timestamp, price:b.price, pnl:null});
    if (s) trades.push({type:'卖出', date:s.timestamp, price:s.price, pnl:s.return});
  });
  tradesBody.innerHTML = trades.map(t => {
    const tagCls = t.type==='买入' ? 'tag-buy' : 'tag-sell';
    const pnlStr = t.pnl===null ? '—' : (t.pnl>=0?'+':'')+fmt(t.pnl)+'%';
    const pnlCls = t.pnl===null ? '' : (t.pnl>=0?'pnl-pos':'pnl-neg');
    return `<tr><td class="${tagCls}">${t.type}</td><td>${fmtDate(t.date)}</td><td>${fmt(t.price)}</td><td class="${pnlCls}">${pnlStr}</td></tr>`;
  }).join('');
}

sel.addEventListener('change', e => render(+e.target.value));
render(0);
</script>
</body>
</html>
