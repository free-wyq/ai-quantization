<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>量化回测看板</title>
<script src="klinecharts.min.js"></script>
<script src="runs/index.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#0f1115; color:#e6e6e6; }
  header { padding:12px 16px; background:#171a21; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; color:#ffd666; }
  select { background:#22262f; color:#e6e6e6; border:1px solid #333; border-radius:6px;
           padding:6px 10px; font-size:14px; min-width:300px; }
  .wrap { padding:16px; }
  #chart { width:100%; height:520px; background:#171a21; border-radius:8px; }
  .panel { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .card { background:#171a21; border:1px solid #262b35; border-radius:8px; padding:10px 14px; min-width:130px; }
  .card .k { font-size:12px; color:#8b93a1; }
  .card .v { font-size:18px; font-weight:600; margin-top:2px; }
  .pos { color:#ff4d4f; } .neg { color:#00c853; }
  #equity { width:100%; height:160px; background:#171a21; border-radius:8px; margin-top:6px; }
  .hint { color:#8b93a1; font-size:12px; margin-left:auto; }
  .section-title { font-size:14px; color:#ffd666; margin:16px 0 8px; }
  table { width:100%; border-collapse:collapse; background:#171a21; border-radius:8px; overflow:hidden; }
  th, td { padding:8px 12px; text-align:right; font-size:13px; border-bottom:1px solid #262b35; }
  th { color:#8b93a1; font-weight:500; background:#1c2029; }
  td:first-child, th:first-child { text-align:center; }
  td.pnl-pos { color:#ff4d4f; } td.pnl-neg { color:#00c853; }
  .tag-buy { color:#ff4d4f; font-weight:600; } .tag-sell { color:#00c853; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>量化回测看板</h1>
  <select id="sel"></select>
  <span class="hint">klinecharts 离线版 · 下拉切换历史</span>
</header>
<div class="wrap">
  <div id="chart"></div>
  <div class="panel" id="metrics"></div>
  <canvas id="equity"></canvas>
  <div class="section-title">交易明细</div>
  <table id="trades">
    <thead><tr><th>类型</th><th>日期</th><th>价格</th><th>盈亏</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const RUNS = window.__RUNS__ || [];
const sel = document.getElementById('sel');
RUNS.forEach((r, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = r.label; sel.appendChild(o);
});

function fmt(n, d=2){ return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function cls(v){ return v>=0 ? 'pos' : 'neg'; }
function sign(v){ return v>=0 ? '+' : ''; }

function drawEquity(equity){
  const cv = document.getElementById('equity');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!equity.length) return;
  const vals = equity.map(e=>e.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = i => w * i/(vals.length-1 || 1);
  const y = v => h - 10 - (h-20) * (v-min)/((max-min)||1);
  ctx.strokeStyle = '#1f77b4'; ctx.lineWidth = 1.5; ctx.beginPath();
  vals.forEach((v,i)=> i? ctx.lineTo(x(i),y(v)) : ctx.moveTo(x(i),y(v)));
  ctx.stroke();
  ctx.fillStyle = '#8b93a1'; ctx.font = '12px sans-serif';
  ctx.fillText('账户权益  '+fmt(vals[vals.length-1]), 8, 16);
}

/* ---- klinecharts v10 ---- */
const chart = klinecharts.init('chart');
let inited = false;

function render(idx){
  const r = RUNS[idx];
  if (!r) return;

  // 清除旧覆盖物
  chart.removeOverlay();

  // v10 要求 _symbol + _period + _dataLoader 三者都就绪才会调用 getBars
  // setSymbol / setPeriod 内部会触发 resetData, 但首次调用时 _dataLoader 还没设置, 不会触发 getBars
  // 最后 setDataLoader 设置 _dataLoader, 三者齐全, getBars 被调用
  chart.setSymbol({ ticker: r.symbol });
  chart.setPeriod({ type: 'day', span: 1 });
  chart.setDataLoader({
    getBars: ({ callback }) => {
      callback(r.candles, false);  // false = 没有更多数据
    }
  });

  // 买卖点 (simpleAnnotation: 虚线+箭头+文字)
  r.buys.forEach(p=>{
    try { chart.createOverlay({
      name: 'simpleAnnotation',
      lock: true,
      points: [{ timestamp: p.timestamp, value: p.price }],
      extendData: 'B',
      styles: { line: { color: '#ff4d4f', style: 'dashed' }, text: { color: '#ff4d4f', size: 13, weight: 'bold' } }
    }); } catch(e){ console.warn('buy overlay:', e); }
  });
  r.sells.forEach(p=>{
    try { chart.createOverlay({
      name: 'simpleAnnotation',
      lock: true,
      points: [{ timestamp: p.timestamp, value: p.price }],
      extendData: 'S',
      styles: { line: { color: '#00c853', style: 'dashed' }, text: { color: '#00c853', size: 13, weight: 'bold' } }
    }); } catch(e){ console.warn('sell overlay:', e); }
  });

  // 指标卡片
  const m = r.metrics;
  const cards = [
    ['策略收益率', sign(m.total_return)+fmt(m.total_return)+'%', cls(m.total_return)],
    ['基准收益率', fmt(m.benchmark)+'%', cls(m.benchmark)],
    ['超额收益', sign(m.excess)+fmt(m.excess)+'%', cls(m.excess)],
    ['夏普比率', fmt(m.sharpe), ''],
    ['最大回撤', fmt(m.max_dd)+'%', 'neg'],
    ['交易次数', m.n_trades, ''],
    ['胜率', fmt(m.win_rate)+'%', ''],
    ['盈亏比', m.profit_factor===Infinity?'∞':fmt(m.profit_factor), ''],
  ];
  document.getElementById('metrics').innerHTML = cards.map(c=>
    `<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('');
  drawEquity(r.equity);

  // 交易明细表: 从 vectorbt 实际成交记录构建 (sells 中已含 pnl 和 return)
  const trades = [];
  r.buys.forEach((b, i) => {
    const s = r.sells[i];
    trades.push({type:'买入', date:b.timestamp, price:b.price, pnl:null});
    if (s) trades.push({type:'卖出', date:s.timestamp, price:s.price, pnl:s.return});
  });

  const fmtDate = ts => {
    const d = new Date(ts);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  };
  const tbody = document.querySelector('#trades tbody');
  tbody.innerHTML = trades.map(t=>{
    const cls = t.type==='买入' ? 'tag-buy' : 'tag-sell';
    const pnlStr = t.pnl===null ? '—' : (t.pnl>=0?'+':'')+fmt(t.pnl)+'%';
    const pnlCls = t.pnl===null ? '' : (t.pnl>=0?'pnl-pos':'pnl-neg');
    return `<tr><td class="${cls}">${t.type}</td><td>${fmtDate(t.date)}</td><td>${fmt(t.price)}</td><td class="${pnlCls}">${pnlStr}</td></tr>`;
  }).join('');
}

sel.addEventListener('change', e => render(+e.target.value));
render(0);
</script>
</body>
</html>
